<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D 游戏序列帧预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#333029;font:15px/1.6 system-ui,sans-serif}main{max-width:960px;margin:36px auto;padding:0 20px}h1{font-size:26px;margin-bottom:6px}p,small{color:#756e64}button,select{font:inherit;background:#fffaf2;border:1px solid #d4cabc;border-radius:6px;padding:7px 12px;color:inherit;cursor:pointer}button.active,#play{background:#99633f;color:white}nav,.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}#stage{margin:18px 0;background-color:#deddd8;background-image:linear-gradient(45deg,#c6c8c7 25%,transparent 25%),linear-gradient(-45deg,#c6c8c7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c6c8c7 75%),linear-gradient(-45deg,transparent 75%,#c6c8c7 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border-radius:10px;overflow:hidden}canvas{display:block;max-width:100%;max-height:65vh;width:auto;height:auto;margin:auto}input{flex:1;min-width:100px;accent-color:#99633f}small{display:block;margin-top:20px}</style>
<main><h1>2D 游戏序列帧</h1><p id="summary"></p><nav id="tabs"></nav><div id="stage"><canvas id="canvas"></canvas></div><div class="controls"><button id="play">暂停</button><input id="seek" type="range" aria-label="帧" min="0" value="0"><span id="counter"></span><select id="speed" aria-label="速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><select id="background" aria-label="背景"><option value="checker">棋盘</option><option value="#27303e">深色</option><option value="#fff">白色</option></select></div><small>循环与抠图质量需对照原视频检查。图中原有的变形、比例变化和边缘残留不会由打包自动修复。</small></main>
<script>
const assets=__PAYLOAD__,manifest=__MANIFEST__;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),images={};canvas.width=manifest.width;canvas.height=manifest.height;
let current=manifest.animations[0].name,index=0,playing=true,last=null,elapsed=0;
document.querySelector('#summary').textContent=`${manifest.width} × ${manifest.height} px · ${manifest.animations.length} 组动作`;
for(const move of manifest.animations){const b=document.createElement('button');b.textContent=`${move.name} · ${move.files.length} 帧`;b.dataset.name=move.name;b.onclick=()=>select(move.name);document.querySelector('#tabs').appendChild(b);images[move.name]=new Image();images[move.name].src=assets[move.name].image;images[move.name].onload=render;}
function frames(){return Object.values(assets[current].data.frames);}
function render(){const fs=frames(),f=fs[index].frame;ctx.clearRect(0,0,canvas.width,canvas.height);if(images[current].complete&&images[current].naturalWidth)ctx.drawImage(images[current],f.x,f.y,f.w,f.h,0,0,canvas.width,canvas.height);document.querySelector('#seek').max=fs.length-1;document.querySelector('#seek').value=index;document.querySelector('#counter').textContent=`${index+1} / ${fs.length}`;document.querySelector('#play').textContent=playing?'暂停':index===fs.length-1?'重播':'播放';for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('active',b.dataset.name===current);}
function select(name){current=name;index=0;elapsed=0;last=null;playing=true;render();}
document.querySelector('#play').onclick=()=>{if(!playing&&index===frames().length-1){index=0;elapsed=0;}playing=!playing;last=null;render();};
document.querySelector('#seek').oninput=e=>{index=Number(e.target.value);elapsed=0;playing=false;render();};
document.querySelector('#background').onchange=e=>{const s=document.querySelector('#stage');s.style.backgroundImage=e.target.value==='checker'?'':'none';s.style.backgroundColor=e.target.value==='checker'?'#deddd8':e.target.value;};
function tick(now){if(last!==null&&playing){elapsed+=(now-last)*Number(document.querySelector('#speed').value);const fs=frames(),total=fs.reduce((s,f)=>s+f.duration,0);if(assets[current].data.meta.loop&&elapsed>total)elapsed%=total;while(playing&&elapsed>=fs[index].duration){elapsed-=fs[index].duration;if(index<fs.length-1)index++;else if(assets[current].data.meta.loop)index=0;else playing=false;}render();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>last=null);
window.spritePreview={select,render,pause:()=>playing=false,setFrame:i=>{index=i;render();},assets,manifest};render();
</script></html>
